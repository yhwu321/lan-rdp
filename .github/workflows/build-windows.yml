name: Build Windows Release

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        shell: pwsh
        run: cargo build --release

      - name: Verify executable exists
        shell: pwsh
        run: |
          if (-not (Test-Path ".\target\release\lan_rdp.exe")) {
            Write-Error "lan_rdp.exe not found after build"
            exit 1
          }
          Write-Host "Build succeeded: target\release\lan_rdp.exe"

      - name: Upload lan_rdp.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: lan-rdp-windows-x64
          path: target/release/lan_rdp.exe
          if-no-files-found: error
